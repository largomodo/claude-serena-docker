# claude-env Serena config: auto template.
# Variants: every variant whose Dockerfile COPYs this file; the index in
# resources/config/CLAUDE.md lists them. x86, snes and android create no Serena
# project (binary analysis only), so no language server starts there. 68k uses this template without
# clangd: it has no asm language server and detects no C sources.
#
# init-workspace.sh copies this file to ~/.serena/serena_config.yml
# ($SERENA_HOME) on every launch. Only keys whose values differ from Serena
# v2 loader defaults are listed: Serena fills the rest from its dataclass
# defaults and re-saves the file with its own template comments on first
# load. web_dashboard (True) and gui_log_window (False) already equal the
# defaults and are left out so nobody re-adds them.

# REPL is pinned explicitly: the loader default for an absent key is
# `tools`, but a fresh Serena install gets REPL and it exposes the smallest MCP
# tool surface: only mcp__serena__serena_repl and
# mcp__serena__initial_instructions exist, and every operation is a facade
# method inside REPL code (s.lsp.find_symbol, s.edit.replace_content, ...).
# Per-operation names such as mcp__serena__find_symbol do not exist, so an
# allowlist naming them matches nothing; claude-config grants the two REPL
# tools to its sub-agents.
agent_interface: REPL

# launch.sh publishes port 24282; the 127.0.0.1 default is unreachable from
# the host.
web_dashboard_listen_address: 0.0.0.0

# No browser exists in the container.
web_dashboard_open_on_launch: False

# /workspace is the only mount. An untrusted project has its
# ls_specific_settings ignored and its symlinks and activation_command skipped.
# `serena project index` and the MCP server (--project /workspace) share this
# gate, so both must see /workspace as trusted. The key is explicit because an
# absent key means ["**"] while a freshly generated template writes [].
trusted_project_path_patterns:
  - /workspace

# Per-project data (project.yml, memories, cache) lives in the gitignored
# .claudeproject, so the user's repository gets no .serena directory. A project
# that has a .serena folder uses it. Memories stored here are not shareable
# through the repository.
project_serena_folder_location: "$projectDir/.claudeproject/serena"

# Serena's loader requires the key; the project registry starts empty.
projects: []
